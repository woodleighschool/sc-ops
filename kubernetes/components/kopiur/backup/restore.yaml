---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
# Snapshots are found by identity (<policy>@<namespace>.<cluster>). Renaming the
# app or moving it to another namespace or cluster finds nothing, and
# onMissingSnapshot: Continue then provisions an empty volume without error.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
