---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-status
spec:
  type: github
  address: https://github.com/woodleighschool/wood-ops
  # Name the commit status after the cluster so each cluster reports separately
  commitStatusExpr: (event.involvedObject.kind + '/' + event.involvedObject.name + '/${CLUSTER}').lowerAscii()
  secretRef:
    name: github-status-token-secret
