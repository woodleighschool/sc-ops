---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metabasis
spec:
  chartRef:
    kind: OCIRepository
    name: metabasis
  interval: 1h
  values:
    controllers:
      metabasis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/woodleighschool/metabasis
              tag: 3.1.1@sha256:f362f3d84dd4cd676684db49cbeb80b024dc9bdb7fe3a1e293e01c548e54dcf6
            args:
              - run
              - --config=/etc/metabasis/config.yaml
            env:
              METABASIS_DATABASE_MAX_CONNECTION_LIFETIME: 30m
              METABASIS_DATABASE_MAX_CONNECTIONS: 10
              METABASIS_DATABASE_MIN_CONNECTIONS: 2
              METABASIS_LISTEN: :8080
              METABASIS_METRICS_LISTEN: :8081
              METABASIS_RECONCILE_POLL_INTERVAL: 1m
              METABASIS_RECONCILE_RETRY_INITIAL: 30s
              METABASIS_RECONCILE_RETRY_MAX: 15m
              TZ: Australia/Melbourne
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
    configMaps:
      config:
        data:
          config.yaml: |-
            version: 2

            connections:
              microsoft:
                type: microsoft_graph
                tenant_id: ${MICROSOFT_TENANT_ID}
                client_id: ${MICROSOFT_CLIENT_ID}
                client_secret: ${MICROSOFT_CLIENT_SECRET}

            webhooks:
              freshservice:
                path: /webhooks/freshservice
                bearer_token: ${FRESHSERVICE_WEBHOOK_TOKEN}

            identity:
              connection: microsoft
              groups:
                students:
                  - f6fe9403-6a17-4990-99aa-9a82744183ec
                staff:
                  - a22c0025-872a-4959-a0fc-b322b5497c47
                block_outside_australia:
                  - eea0b866-eef8-41dd-8e6b-be74cca8a32a
                allow_overseas:
                  - cac03843-c1ed-44b1-bab1-a2d4deb7bf4d
                enable_mfa:
                  - e78a3a24-50e8-41ab-b149-8e6a4b4ce83f
                force_mfa:
                  - 857f6c15-83a0-4188-adef-4e961e5d6d3f

            rules:
              - name: students
                when: '"students" in user.groups'
                states:
                  pending:
                    present:
                      - block_outside_australia
                      - enable_mfa
                    absent:
                      - allow_overseas
                      - force_mfa
                  active:
                    present:
                      - allow_overseas
                      - enable_mfa
                      - force_mfa
                    absent:
                      - block_outside_australia
                  settled:
                    present:
                      - block_outside_australia
                    absent:
                      - allow_overseas
                      - enable_mfa
                      - force_mfa

              - name: staff
                when: '"staff" in user.groups'
                states:
                  pending:
                    present:
                      - block_outside_australia
                    absent:
                      - allow_overseas
                  active:
                    present:
                      - allow_overseas
                      - force_mfa
                    absent:
                      - block_outside_australia
                  settled:
                    present:
                      - block_outside_australia
                    absent:
                      - allow_overseas

    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: 8081
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://metabasis.woodleigh.vic.edu.au/healthz
        hostnames:
          - "{{ .Release.Name }}.woodleigh.vic.edu.au"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/metabasis/config.yaml
            subPath: config.yaml
