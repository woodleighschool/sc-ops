---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onomazo
spec:
  chartRef:
    kind: OCIRepository
    name: onomazo
  interval: 1h
  values:
    controllers:
      onomazo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/woodleighschool/onomazo
              tag: 0.1.6@sha256:be5ce4c1cbecfbb7635ac87a5bf68121faa11cc2f168c80cd0d81bebc6575db5
            args:
              - run
              - --config=/etc/onomazo/config.yaml
              - --config=/etc/onomazo/naming.yaml
            env:
              ONOMAZO_RECONCILE_CONCURRENCY: 8
              ONOMAZO_STATE_PATH: /data/state.json
              ONOMAZO_STATE_TYPE: file
              TZ: Australia/Melbourne
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      config:
        data:
          config.yaml: |-
            version: 1

            connections:
              microsoft:
                type: microsoft_graph
                tenant_id: ${MICROSOFT_TENANT_ID}
                client_id: ${MICROSOFT_CLIENT_ID}
                client_secret: ${MICROSOFT_CLIENT_SECRET}
              jamf:
                type: jamf
                url: ${JAMF_URL}
                client_id: ${JAMF_CLIENT_ID}
                client_secret: ${JAMF_CLIENT_SECRET}

            devices:
              - name: intune
                type: intune
                connection: microsoft
                platforms: [macos, ios, windows]
              - name: jamf
                type: jamf
                connection: jamf
                platforms: [macos, ios]

            identity:
              name: entra
              type: entra
              connection: microsoft
              groups:
                students:
                  - f6fe9403-6a17-4990-99aa-9a82744183ec
                staff:
                  - a22c0025-872a-4959-a0fc-b322b5497c47
                  - 68ab7052-a5d1-4255-b3cf-72b91113eb20
                senior:
                  - 50c29194-520b-427c-829f-694815ca6520
                  - 75e61704-e43c-4dd5-894c-0e65ee48a3f6
                  - 68ab7052-a5d1-4255-b3cf-72b91113eb20
                minimbah:
                  - a99ce3c9-00e2-4c0e-90a7-2b16a1f2a696
                  - 38cacf1b-2d06-4abd-9734-52efa827ccbf
                  - 57708a3e-8990-45b6-ba60-f5b469d9de04
                penbank:
                  - 740322a9-73bc-4763-8732-6ccfc84d2a56
                  - fa3a32ea-babe-44ea-bfae-3cdf2ee36531
                  - 2bc8c366-8563-42e3-8594-5469b255c965

            naming:
              constraints:
                max_length: 63
                pattern: "^[A-Z0-9][A-Z0-9-]*$"

              variables:
                position:
                  cases:
                    - when: '"students" in user.groups'
                      value: S
                    - when: '"staff" in user.groups && !("students" in user.groups)'
                      value: T
                campus:
                  cases:
                    - when: '"senior" in user.groups'
                      value: S
                    - when: '"minimbah" in user.groups && !("senior" in user.groups)'
                      value: M
                    - when: |
                        "penbank" in user.groups &&
                        !("senior" in user.groups) &&
                        !("minimbah" in user.groups)
                      value: P

              rules:
                - name: default
                  when: |
                    device.platform in ["ios", "macos", "windows"] &&
                    "campus" in vars &&
                    "position" in vars &&
                    user.present &&
                    user.mail_nickname != ""
                  desired_name: |
                    (vars["campus"] + vars["position"] + "-" + slug(user.mail_nickname)).upperAscii()

              collisions:
                rank:
                  - expression: |
                      device.source == "intune" ? 0 :
                      device.source == "jamf" ? 1 :
                      99
                    order: ascending
                  - expression: |
                      device.platform == "macos" ? 0 :
                      device.platform == "ios" ? 1 :
                      device.platform == "windows" ? 2 :
                      99
                    order: ascending
                  - expression: device.enrolled_at
                    order: descending
                disambiguate:
                  type: sequence
                  separator: "-"
                  preserve_existing: false
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/onomazo/config.yaml
            subPath: config.yaml
      naming:
        type: secret
        name: onomazo-naming
        globalMounts:
          - path: /etc/onomazo/naming.yaml
            subPath: naming.yaml
      state:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
