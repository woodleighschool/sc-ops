---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodsweep
spec:
  chartRef:
    kind: OCIRepository
    name: woodsweep
  interval: 1h
  values:
    controllers:
      woodsweep:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1@sha256:27da0a33b44e1b902150a6c963514237217464bb13118a95bb056667be93cda5
            args:
              - --async-repo-connect
              - --server-control-username=bootstrap@woodsweep
              - --server-username=woodmin
              - --tls-generate-cert
              - --tls-generate-cert-name=woodsweep.default.svc.cluster.local
            envFrom:
              - secretRef:
                  name: woodsweep-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65533
        fsGroup: 65533
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 51515
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
