---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodgate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: woodgate-secret
    template:
      data:
        WOODGATE_DATABASE_URL: "postgres://{{ .DATABASE_USER }}:{{ .DATABASE_PASSWORD }}@postgres-rw.databases.svc.cluster.local:5432/woodgate?sslmode=disable"
        WOODGATE_ENTRA_TENANT_ID: "{{ .ENTRA_TENANT_ID }}"
        WOODGATE_ENTRA_CLIENT_ID: "{{ .ENTRA_CLIENT_ID }}"
        WOODGATE_ENTRA_CLIENT_SECRET: "{{ .ENTRA_CLIENT_SECRET }}"
        WOODGATE_OIDC_ISSUER_URL: "https://login.microsoftonline.com/{{ .ENTRA_TENANT_ID }}/v2.0"
        WOODGATE_OIDC_CLIENT_ID: "{{ .ENTRA_CLIENT_ID }}"
        WOODGATE_OIDC_CLIENT_SECRET: "{{ .ENTRA_CLIENT_SECRET }}"
        WOODGATE_STORAGE_CAPABILITY_KEY: "{{ .STORAGE_CAPABILITY_KEY }}"
  dataFrom:
    - extract:
        key: woodgate
