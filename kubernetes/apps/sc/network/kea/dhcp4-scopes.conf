// SC's DHCPv4 scopes and global options, included into the Dhcp4 map of
// kubernetes/apps/base/network/kea/app/resources/kea-dhcp4.conf.

// Options every scope gets unless it sets its own.
"option-data": [
  // Clients renew by unicast to the server identifier, so it must be the kea
  // Service address rather than the pod's.
  { "name": "dhcp-server-identifier", "data": "${KEA_ADDRESS}" },
  { "name": "domain-name", "data": "woodleighschool.net" },
  { "name": "domain-name-servers", "data": "10.10.69.53" }
],

// One subnet per VLAN, found by the relay address (giaddr) the switch puts in
// every request. The id identifies the subnet in the lease file: never reuse or
// renumber one.
//
// {
//   "id": 120,
//   "subnet": "10.10.120.0/24",
//   "pools": [ { "pool": "10.10.120.50 - 10.10.120.250" } ],
//   "valid-lifetime": 28800,
//   "option-data": [ { "name": "routers", "data": "10.10.120.1" } ],
//   "reservations": [
//     { "hw-address": "aa:bb:cc:dd:ee:ff", "ip-address": "10.10.120.20", "hostname": "st-printer-1" }
//   ]
// }
"subnet4": []
