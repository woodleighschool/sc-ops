---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
secretGenerator:
  - name: onomazo-naming
    files:
      - naming.yaml=./resources/naming.sops.yaml
generatorOptions:
  disableNameSuffixHash: true
