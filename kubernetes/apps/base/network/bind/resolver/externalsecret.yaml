---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bind-keys
    template:
      data:
        # Transfers from the primary, and the primary's NOTIFYs, are signed
        # with this key.
        tsig.conf: |
          key "xfr" { algorithm hmac-sha256; secret "{{ index . "tsig-xfr" }}"; };
  dataFrom:
    - extract:
        key: bind
