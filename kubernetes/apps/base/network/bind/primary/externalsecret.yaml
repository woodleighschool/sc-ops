---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bind-primary
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bind-primary-keys
    template:
      data:
        # Every key the primary accepts: the transfer key, and a Kea and an
        # external-dns key per cluster
        tsig.conf: |
          key "xfr" { algorithm hmac-sha256; secret "{{ index . "tsig-xfr" }}"; };
          key "kea-sc" { algorithm hmac-sha256; secret "{{ index . "tsig-kea-sc" }}"; };
          key "external-dns-sc" { algorithm hmac-sha256; secret "{{ index . "tsig-external-dns-sc" }}"; };
  dataFrom:
    - extract:
        key: bind
