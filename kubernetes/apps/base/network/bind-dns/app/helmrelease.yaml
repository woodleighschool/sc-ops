---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bind-dns
spec:
  chartRef:
    kind: OCIRepository
    name: bind-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: rfc2136
    env:
      - name: &name EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: &secret bind-dns-secret
            key: *name
    extraArgs:
      - --create-ptr
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # DNSEndpoints labelled public are for Cloudflare only
      - --label-filter=dns.woodleighschool.net/scope!=public
      # --rfc2136-min-ttl rewrites records on every sync (external-dns #6723)
      - --min-ttl=300s
      - --rfc2136-axfr
      - --rfc2136-host=10.10.69.54
      - --rfc2136-port=53
      - --rfc2136-tsig-keyname=external-dns-${CLUSTER}
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-zone=10.in-addr.arpa
      - --rfc2136-zone=woodleigh.vic.edu.au
      - --rfc2136-zone=woodleighschool.net
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - crd
      - gateway-httproute
      - service
    txtOwnerId: ${CLUSTER}
    txtPrefix: k8s.
    domainFilters:
      - 10.in-addr.arpa
      - woodleigh.vic.edu.au
      - woodleighschool.net
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
