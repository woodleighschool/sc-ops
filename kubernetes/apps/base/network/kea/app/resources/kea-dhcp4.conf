// Kea DHCPv4. Scopes and global options come from the cluster's
// dhcp4-scopes.conf, included at the end.
{
  "Dhcp4": {
    // The switches relay client broadcasts to this server's Service address, so
    // everything arrives as unicast. UDP sockets ignore stray broadcasts.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "udp",
      "service-sockets-require-all": true,
      "service-sockets-max-retries": 5,
      "service-sockets-retry-wait-time": 2000
    },

    // The unix socket is for kea-exporter; HTTP on loopback is for the probes.
    // start.sh writes the probe credentials.
    "control-sockets": [
      { "socket-type": "unix", "socket-name": "kea4-ctrl.sock" },
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8004,
        "authentication": {
          "type": "basic",
          "realm": "kea-dhcp4",
          "directory": "/run/kea-k8s",
          "clients": [ { "password-file": "api-dhcp4" } ]
        }
      }
    ],

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "kea-leases4.csv",
      "lfc-interval": 3600
    },

    // Kea sizes its thread pool from the node's CPUs otherwise.
    "multi-threading": {
      "enable-multi-threading": true,
      "thread-pool-size": 4,
      "packet-queue-size": 28
    },

    // lease4-* commands, e.g. lease4-add and lease4-resend-ddns.
    "hooks-libraries": [ { "library": "libdhcp_lease_cmds.so" } ],

    // NAK clients asking for an address this server did not give them, so they
    // start over at once instead of waiting.
    "authoritative": true,
    "valid-lifetime": 28800,

    // Every client that sends a name gets an A and a PTR in woodleighschool.net,
    // written by this server whatever the client asks for and removed when the
    // lease ends. BIND refuses clients' own updates.
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001,
      "max-queue-size": 1024,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },
    "ddns-send-updates": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-replace-client-name": "never",
    "ddns-qualifying-suffix": "woodleighschool.net.",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "-",
    // A name held by another client, or by a static record, is left alone.
    "ddns-conflict-resolution-mode": "check-with-dhcid",
    // Turn on with Kea 3.2.1, which fixes records being removed on renew.
    "ddns-update-on-renew": false,

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      },
      // Kea 3.2 warns DHCP_RECEIVE4_UNKNOWN on every control-socket request,
      // so on every probe.
      {
        "name": "kea-dhcp4.dhcp",
        "output-options": [ { "output": "stdout" } ],
        "severity": "ERROR"
      }
    ],

    <?include "/etc/kea-scopes/dhcp4-scopes.conf"?>
  }
}
