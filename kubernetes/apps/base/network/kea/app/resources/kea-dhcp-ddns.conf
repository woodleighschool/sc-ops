// Kea DHCP-DDNS: turns kea-dhcp4's name changes into updates to the BIND
// primary, signed with this cluster's key, kea-<cluster>.
{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 1000,
    "ncr-protocol": "UDP",
    "ncr-format": "JSON",

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "kea-ddns-ctrl.sock" },
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8053,
        "authentication": {
          "type": "basic",
          "realm": "kea-dhcp-ddns",
          "directory": "/run/kea-k8s",
          "clients": [ { "password-file": "api-ddns" } ]
        }
      }
    ],

    "tsig-keys": [
      {
        "name": "kea-${CLUSTER}",
        "algorithm": "HMAC-SHA256",
        "secret-file": "/etc/kea-tsig/secret"
      }
    ],

    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "woodleighschool.net.",
          "key-name": "kea-${CLUSTER}",
          "dns-servers": [ { "ip-address": "10.10.69.54" } ]
        }
      ]
    },
    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "10.in-addr.arpa.",
          "key-name": "kea-${CLUSTER}",
          "dns-servers": [ { "ip-address": "10.10.69.54" } ]
        }
      ]
    },

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
