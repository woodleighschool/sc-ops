---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kea-secret
    template:
      data:
        # kea-dhcp-ddns reads the first line: the base64 secret of kea-<cluster>
        secret: '{{ index . "tsig-kea-${CLUSTER}" }}'
  dataFrom:
    - extract:
        key: bind
